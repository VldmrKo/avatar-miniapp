[project]
name = "avatar-miniapp"
version = "0.1.0"
description = "Аватар: бот и мини-приложение для MAX и Telegram"
requires-python = ">=3.11"
dependencies = [
    "avatar-core",
    "aiohttp>=3.9",
    # Две библиотеки мессенджеров сразу: один процесс работает с одним
    # из них, но код и venv на сервере общие, а разводить две установки
    # ради экономии десяти мегабайт не стоит.
    "maxapi==1.2.2",
    "aiogram>=3.13,<4",
    # Без него aiogram отказывается работать через socks5-прокси, причём
    # выясняется это только в момент первого запроса. А прокси — сейчас
    # единственный способ дозвониться до Telegram с российской площадки.
    "aiohttp-socks>=0.8",
    "pillow>=10.0",
    # Доверие к хранилищу сертификатов системы. Нужно там, где сеть вскрывает
    # TLS своим корнем: на сервере не включается, на рабочей машине без него
    # не подняться. Весит десяток килобайт, ставим везде.
    "truststore>=0.9",
]

[project.optional-dependencies]
# pytest-asyncio назван явно, хотя его тянет pytest-aiohttp. Он единственный,
# без кого асинхронные тесты не запускаются вообще — pytest при этом не падает,
# а честно сообщает про «async def не поддерживается» пятьюдесятью строками,
# и выглядит это как сломанный код, а не как отсутствующий плагин.
dev = ["pytest>=8.0", "pytest-aiohttp>=1.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
avatar-core = { path = "../avatar-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_miniapp"]

[tool.ruff]
line-length = 100
target-version = "py311"
