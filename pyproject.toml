[project]
name = "avatar-miniapp"
version = "0.1.0"
description = "Мини-приложение «Аватар» для мессенджера MAX"
requires-python = ">=3.11"
dependencies = [
    "avatar-core",
    "aiohttp>=3.9",
    "maxapi==1.2.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-aiohttp>=1.0"]

[tool.uv.sources]
avatar-core = { path = "../avatar-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_miniapp"]

[tool.ruff]
line-length = 100
target-version = "py311"
